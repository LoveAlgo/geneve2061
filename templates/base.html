<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page_title %}{{ page_title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ description | default(site.tagline) }}">
<link rel="icon" href="{{ root }}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<header class="site">
  <div class="bar">
    <a class="brand" href="{{ root }}">{% include "symbol.html" %}Geneva <span>2061</span></a>
    <nav class="main" aria-label="Main">
      <a href="{{ root }}"{% if nav == 'walk' %} aria-current="page"{% endif %}>The 2061 walk</a>
      <a href="{{ root }}themes/"{% if nav == 'themes' %} aria-current="page"{% endif %}>Themes</a>
      <a href="{{ root }}grooters/"{% if nav == 'grooters' %} aria-current="page"{% endif %}>The Grooters</a>
      <a href="{{ root }}about/"{% if nav == 'about' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
<footer>
  <p>{{ site.copyright }}</p>
  <p>{{ site.footer }}</p>
</footer>
</body>
</html>
