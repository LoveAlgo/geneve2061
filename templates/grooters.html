{% extends "base.html" %}
{% block main %}
<div class="measure">
  <h1>{{ page.title }}</h1>
  <div class="g-intro">
    <img class="g-cover" src="{{ root }}assets/images/grooters-1-cover.jpg" alt="{{ t.cover_alt }}" width="700" height="1120">
    <div class="prose">{{ page.html | safe }}</div>
  </div>

  <h2>{{ t.read_walk }}</h2>
  <p>{{ t.read_walk_text }}</p>
  <div class="downloads">
    <a class="dl" href="{{ root }}assets/downloads/{{ t.download_file }}" download>{{ t.download }}<small>{{ t.download_meta }}</small></a>
  </div>

  <figure class="g-fig">
    <img src="{{ root }}assets/images/young-grooters-hut.jpg" alt="{{ t.hut_alt }}" width="1400" height="1400" loading="lazy">
    <figcaption>{{ page.hut_caption }}</figcaption>
  </figure>
  <figure class="g-fig g-fig-narrow">
    <img src="{{ root }}assets/images/verity-crystal-of-love.jpg" alt="{{ t.crystal_alt }}" width="1045" height="1400" loading="lazy">
    <figcaption>{{ page.crystal_caption }}</figcaption>
  </figure>

  <h2>{{ t.more_series }}</h2>
  <p>{{ t.more_series_text }} <a href="{{ t.grooters_url }}" target="_blank" rel="noopener">{{ t.grooters_link }}</a>.</p>
</div>
{% endblock %}
