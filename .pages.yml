  - name: today_facts
    label: 'Geneva today: more facts'
    type: text
    list: true
  - name: precedents
    label: Where it is already done
    type: object
    list: true
    fields:
    - name: place
      label: Place
      type: string
    - name: text
      label: What they did
      type: text
    - name: source_needed
      label: Source still to be added
      type: boolean
  - fields:
    - label: Pattern number
      name: number
      type: string
    - label: Pattern name (as in the book)
      name: name
      type: string
    - label: Summary in your own words
      name: text
      type: text
    label: A Pattern Language (Alexander et al., 1977)
    list: true
    name: patterns
    type: object
  - name: path
    label: The path to 2061
    type: object
    list: true
    fields:
    - name: year
      label: Year
      type: string
    - name: text
      label: Milestone
      type: text
  - name: questions
    label: Open questions
    type: text
    list: true
  - name: view
    label: The author’s view
    type: text
  - name: sources
    label: Sources
    type: object
    list: true
    fields:
    - name: title
      label: Title
      type: string
    - name: url
      label: Link
      type: string
- name: themes
  label: Themes (English names, French names and codes)
  type: file
  path: data/themes.yml
  fields:
  - name: themes
    label: Themes
    type: object
    list: true
    fields:
    - name: code
      label: Code
      type: string
    - name: name
      label: Name
      type: string
    - name: covers
      label: Covers
      type: string
    - name: name_fr
      label: Nom (français)
      type: string
    - name: code_fr
      label: Code (français)
      type: string
    - name: heading
      label: Heading on the theme page (optional)
      type: string
    - name: intro
      label: Introduction on the theme page (optional)
      type: text
- name: themes_fr
  label: Thèmes (descriptions en français)
  type: file
  path: data/themes_fr.yml
  fields:
  - name: themes
    label: Thèmes
    type: object
    list: true
    fields:
    - name: code
      label: English code (do not change)
      type: string
    - name: covers
      label: Contenu du thème
      type: string
    - name: heading
      label: Titre de la page du thème (facultatif)
      type: string
    - name: intro
      label: Introduction de la page du thème (facultatif)
      type: text
- name: walk
  label: 2061 walk (English)
  type: file
  path: data/walk.yml
  fields:
  - name: intro
    label: Introduction
    type: text
  - name: stops
    label: Stops
    type: object
    list: true
    fields:
    - name: place
      label: Place
      type: string
    - name: see
      label: What Verity sees
      type: text
    - name: theme
      label: Theme
      type: select
      options:
        values: *id001
    - name: quote
      label: Quote (optional)
      type: text
  - name: final
    label: Final stop
    type: object
    fields:
    - name: place
      label: Title
      type: string
    - name: see
      label: Text
      type: text
