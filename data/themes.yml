  - code: HEA
    name: Health
    covers: Prevention, care, accidents, the HUG-Centre
    name_fr: Santé
    code_fr: SAN
    heading: "Health: towards a city without sickness or accidents"
    intro: >-
      Where Geneva’s hospital stands today, Verity finds a HUG-Centre, where
      people come to refuel on affection. When she asks where the sick are
      treated, Smaranda answers with a simple principle: supply and demand. As
      people stay healthy, the demand for treatment shrinks, and the hospital
      shrinks with it.


      The ideas below are the steps on that path. Some have already been
      achieved elsewhere; one or two are still open research questions.
