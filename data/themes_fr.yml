  - code: CAL
    covers: Routes silencieuses, technologie silencieuse, solutions de réduction du
      bruit, calme mental
    heading: "Calme : une ville où l’on s’entend penser"
    intro: "En se promenant dans la Genève de 2061, l’une des premières choses que
      remarque Verity, c’est à quel point tout est calme : aucun véhicule à
      essence bruyant, seulement des gens à pied et à vélo, et sur le lac, des
      voiliers qui glissent silencieusement. Le calme est l’une des qualités les
      plus sous-estimées d’une ville. Le bruit provoque du stress, nuit à la
      santé et figure parmi les principales causes de disputes entre voisins,
      tandis que le silence nous aide à nous reposer, à réfléchir et à vivre
      ensemble. Les idées ci-dessous couvrent le calme pour les oreilles, des
      rues aux logements et aux machines, et le calme pour l’esprit, de la
      surcharge d’informations au débat public."
