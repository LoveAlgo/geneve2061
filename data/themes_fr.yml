  - code: HEA
    covers: Prévention, soins, accidents, le HUG-Centre
    heading: "Santé : vers une ville sans maladie ni accident"
    intro: >-
      À l’endroit où se dresse aujourd’hui l’hôpital de Genève, Verity découvre
      un HUG-Centre, où les gens viennent faire le plein d’affection. Quand elle
      demande où l’on soigne les malades, Smaranda répond par un principe simple
      : l’offre et la demande. Quand les gens restent en bonne santé, la demande
      de soins diminue, et l’hôpital avec elle.


      Les idées ci-dessous sont les étapes de ce chemin. Certaines ont déjà été
      réalisées ailleurs ; une ou deux restent des questions ouvertes pour la
      recherche.
