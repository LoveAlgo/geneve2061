  side_reform_title: Reformer et réformer
  side_reform_html: >-
    En français, l’accent change le sens. Sans accent, <em>reformer</em> signifie former de nouveau,
    remodeler : le travail des urbanistes sur les rues, les bâtiments et les parcs. Avec l’accent,
    <em>réformer</em>, c’est transformer les mentalités, les lois et les institutions, comme l’a fait Calvin.
    Genève 2061 a besoin des deux.
  side_reform_cite: Comme l’explique Verity dans Grooters, Livre 1.
