  side_reform_title: Reformer and réformer
  side_reform_html: >-
    In French, the accent changes the meaning. Without it, <em>reformer</em> means to form again, to
    reshape: the work of urban planners on streets, buildings and parks. With it, <em>réformer</em>
    means to reform mindsets, laws and institutions, as Calvin did. Geneva 2061 needs both.
  side_reform_cite: As Verity explains in Grooters, Book 1.
